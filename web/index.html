<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>局域网审片</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- 按钮用的线条图标（24×24），按钮里写 <svg class="ico"><use href="#i-名字"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18.5 14.2A6.5 6.5 0 0 1 21.5 20"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-backup" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-check-all" viewBox="0 0 24 24"><path d="M17 6 6.5 16.5 2 12"/><path d="m22 10-6.5 6.5-1.5-1.5"/></symbol>
  <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol>
  <symbol id="i-rename" viewBox="0 0 24 24"><path d="M13 20h8"/><path d="M16.4 3.6a2 2 0 0 1 2.9 2.9L7 18.8 3 20l1.2-4z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M16.4 3.6a2 2 0 0 1 2.9 2.9L7 18.8 3 20l1.2-4z"/><path d="m14 6 4 4"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M3 17c2.5-5 4.5-7 6.5-4.5S12.5 18 15.5 13s4-5 5.5-3"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="1"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V4h14v3"/><path d="M12 4v16"/><path d="M9 20h6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21.5 2.5 2.5 10l7 3.5 3.5 7z"/><path d="M21.5 2.5 9.5 13.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M3 6h18M3 12h11M3 18h7"/><path d="m15 15 6 6M21 15l-6 6"/></symbol>
  <symbol id="i-update" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 4-4 4 4"/><path d="M12 16V8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></symbol>
  <symbol id="i-start" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8"/><path d="M7 21v-7h10v7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
<header id="topbar">
  <div class="brand">局域网审片</div>
  <div id="me"></div>
  <div class="spacer"></div>
  <button id="btn-help" title="使用说明"><svg class="ico"><use href="#i-help"/></svg><span>说明</span></button>
  <button id="btn-people" title="团队里的人和他们的电脑；同事没自动出现时，在这里按 IP 添加"><svg class="ico"><use href="#i-users"/></svg><span>成员</span></button>
  <button id="btn-settings" title="用户名、团队口令、共享目录、运行选项、本机信息"><svg class="ico"><use href="#i-settings"/></svg><span>设置</span></button>
</header>
<div id="share-error" hidden>
  <span id="share-error-text"></span>
  <span class="row"><button id="btn-share-retry" class="primary" title="重新打开共享文件夹"><svg class="ico"><use href="#i-retry"/></svg><span>重试</span></button><button id="btn-share-change" title="更换共享文件夹"><svg class="ico"><use href="#i-swap"/></svg><span>更换</span></button></span>
</div>
<div id="paused-bar" hidden>
  <span>服务已暂停：同事看不到你的视频，你也看不到同事的视频和新批注。</span>
  <button id="btn-resume" class="primary" title="恢复服务"><svg class="ico"><use href="#i-play"/></svg><span>恢复</span></button>
</div>
<div id="update-bar" hidden>
  <span id="update-text"></span>
  <span class="row" id="update-actions"></span>
</div>
<div id="fileshare-bar" hidden>
  <span id="fileshare-text"></span>
  <span class="row" id="fileshare-actions"><button class="primary" data-act="ok"><svg class="ico"><use href="#i-check"/></svg><span>好的</span></button><button data-act="settings" title="去设置里看看"><svg class="ico"><use href="#i-settings"/></svg><span>设置</span></button></span>
</div>
<div id="dl-done-bar" hidden>
  <span id="dl-done-text"></span>
  <span class="row" id="dl-done-actions"></span>
</div>

<main id="main">
  <aside id="sidebar">
    <!-- 常驻在侧栏顶部：提醒（我的视频收到的批注、@ 我的、回复我的）和下载（从同事那里拿的文件） -->
    <div id="side-top">
      <button id="btn-inbox" title="我的视频收到的批注、@ 我的、回复我的"><svg class="ico"><use href="#i-bell"/></svg><span>提醒</span><span class="badge" hidden></span></button>
      <button id="btn-downloads" title="从同事那里拿的文件"><svg class="ico"><use href="#i-download"/></svg><span>下载</span><span class="badge" hidden></span></button>
    </div>
    <div id="video-list"></div>
  </aside>

  <section id="stage">
    <div id="empty-hint">从左边选一个视频开始审片</div>
    <div id="player" hidden>
      <!-- 只在需要分享者确认"是不是新版本"时出现 -->
      <div id="version-bar" hidden></div>
      <div id="video-area">
        <div id="video-wrap">
          <video id="video" preload="auto" playsinline></video>
          <canvas id="overlay"></canvas>
          <div id="video-msg" hidden></div>
        </div>
      </div>
      <div id="timeline"><div id="tl-progress"></div><div id="tl-markers"></div></div>
      <!-- 一行：左边视频名称（改名、调整版本），中间时间码，右边播放和批注 -->
      <div id="controls">
        <div class="ctl-left">
          <div id="video-title"></div>
          <div id="video-sub" class="ctl-info"></div>
        </div>
        <div class="ctl-mid">
          <span id="tc">00:00:00:00</span>
          <span class="ctl-info"><span id="frame-no"></span> <span id="video-meta"></span></span>
        </div>
        <div class="ctl-right">
          <button id="btn-play" title="播放 / 暂停（空格）；← → 逐帧，按住 Shift 一次 10 帧"><svg class="ico"><use href="#i-play"/></svg><span>播放</span></button>
          <button id="btn-annotate" class="primary" title="批注这一帧（快捷键 C）"><svg class="ico"><use href="#i-comment"/></svg><span>批注</span></button>
        </div>
      </div>
      <div id="editor" hidden>
        <div class="tools">
          <span class="label">画笔</span>
          <button data-tool="pen" class="tool active" title="自由画"><svg class="ico"><use href="#i-pen"/></svg><span>画笔</span></button>
          <button data-tool="arrow" class="tool"><svg class="ico"><use href="#i-arrow"/></svg><span>箭头</span></button>
          <button data-tool="rect" class="tool"><svg class="ico"><use href="#i-rect"/></svg><span>方框</span></button>
          <button data-tool="text" class="tool" title="在画面上点一下写字"><svg class="ico"><use href="#i-text"/></svg><span>文字</span></button>
          <span class="colors">
            <button data-color="#ff3b30" class="color active" style="--c:#ff3b30"></button>
            <button data-color="#ffcc00" class="color" style="--c:#ffcc00"></button>
            <button data-color="#34c759" class="color" style="--c:#34c759"></button>
            <button data-color="#0a84ff" class="color" style="--c:#0a84ff"></button>
            <button data-color="#ffffff" class="color" style="--c:#ffffff"></button>
          </span>
          <button id="ed-undo" title="撤销一笔"><svg class="ico"><use href="#i-undo"/></svg><span>撤销</span></button>
          <span id="ed-frame" class="muted"></span>
        </div>
        <textarea id="ed-text" placeholder="写下批注（输入 @ 提醒同事，可以直接粘贴图片）"></textarea>
        <div class="attach-row">
          <label class="btn" title="添加图片，也可以直接粘贴"><svg class="ico"><use href="#i-image"/></svg><span>图片</span><input type="file" id="ed-file" accept="image/*" multiple hidden></label>
          <div id="ed-attachments"></div>
        </div>
        <div class="ed-actions">
          <span id="ed-error" class="error"></span>
          <button id="ed-cancel"><svg class="ico"><use href="#i-x"/></svg><span>取消</span></button>
          <button id="ed-save" class="primary" title="发布批注"><svg class="ico"><use href="#i-send"/></svg><span>发布</span></button>
        </div>
      </div>
    </div>
  </section>

  <aside id="comments">
    <div class="comments-head">
      <span>批注</span>
      <select id="sort-anns" title="批注排序">
        <option value="tc">按时间码</option>
        <option value="new">按批注时间（最新在前）</option>
        <option value="old">按批注时间（最早在前）</option>
      </select>
    </div>
    <div id="comment-list"><div class="muted pad">还没有选视频</div></div>
  </aside>
</main>

<div id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
<div id="toast" hidden></div>
<!-- 写批注、回复时输入 @ 弹出的成员列表 -->
<div id="mention-pop" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
